name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Create release tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf mav-${VERSION}.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='.superpowers' \
            .

      - name: Compute SHA256
        id: sha256
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(sha256sum mav-${VERSION}.tar.gz | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        env:
          VERSION: ${{ steps.sha256.outputs.version }}
          SHA: ${{ steps.sha256.outputs.sha256 }}
        run: |
          sed -i \
            -e "s|/archive/refs/tags/v[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz|/archive/refs/tags/v${VERSION}.tar.gz|g" \
            -e "s|sha256 \".*\"|sha256 \"${SHA}\"|g" \
            Formula/mav.rb

      - name: Commit updated formula
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update formula for v${{ steps.sha256.outputs.version }}"
          file_pattern: Formula/mav.rb
          skip_dirty_check: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mav-${{ steps.sha256.outputs.version }}.tar.gz
          generate_release_notes: true
